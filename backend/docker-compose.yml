services:
  postgres:
    image: postgres:16-alpine
    container_name: itmanagement_db
    environment:
      POSTGRES_DB: itmanagement
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/ITManagement.API/Dockerfile
    container_name: itmanagement_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=itmanagement;Username=postgres;Password=postgres
      - "Jwt__Secret=${JWT_SECRET:?Set JWT_SECRET before starting Compose}"
      - "SeedAdmin__Password=${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD before starting Compose}"
      - Jwt__Issuer=ITManagement
      - Jwt__Audience=ITManagement
      - FileStorage__RootPath=/app/storage
      - Cors__Origins__0=http://localhost:5173
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - file_storage:/app/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  web:
    build:
      context: ../frontend/admin
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:80"

volumes:
  postgres_data:
  file_storage:
